  loki:
    image: grafana/loki:3.5.1
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/blocks/loki-json-logs/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  alloy:
    image: grafana/alloy:v1.9.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/blocks/loki-json-logs/config.alloy:/etc/alloy/config.alloy:ro
      - ../data/log:/var/log/grafana:ro
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      - loki
