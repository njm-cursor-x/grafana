server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

client:
  url: http://loki:3100/api/prom/push

scrape_configs:
- job_name: system
  static_configs:
  - targets:
      - localhost
    labels:
      job: varlogs
      __path__: /var/log/*log
- job_name: grafana
  static_configs:
  - targets:
      - localhost
    labels:
      job: grafana
      service_name: grafana
      __path__: /var/log/grafana/*log
  pipeline_stages:
    # Promote only level and logger. Other JSON fields stay on the line so
    # Explore and Logs Drilldown can parse them. Prefer stable `level`
    # (error) over go-kit `lvl` (eror) when both are present. Non-JSON lines
    # still ship with the static labels.
    - json:
        expressions:
          level: level
          lvl: lvl
          logger: logger
    - template:
        source: level
        template: '{{ if .level }}{{ .level }}{{ else if eq .lvl "eror" }}error{{ else }}{{ .lvl }}{{ end }}'
    - labels:
        level:
        logger:
