# Print-style logging gate (structured logging CI lane).
# Not part of default `make lint-go`. Run with `make lint-go-print`.
# Existing fmt.Print*/log.Print* are grandfathered: CI and the make target
# only report issues introduced after GIT_BASE / the PR merge-base.

# $schema: https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: '2'
run:
  timeout: 10m
  concurrency: 0
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - forbidigo
  settings:
    forbidigo:
      analyze-types: true
      exclude-godoc-examples: true
      forbid:
        - pattern: '^fmt\.Print(f|ln)?$'
          msg: do not use fmt.Print*; use pkg/infra/log for structured logging
        - pattern: '^log\.Print(f|ln)?$'
          msg: do not use the standard library log.Print*; use pkg/infra/log for structured logging
  exclusions:
    generated: lax
    rules:
      - linters:
          - forbidigo
        path: (.+)_test\.go
      - linters:
          - forbidigo
        path: pkg/cmd/
      - linters:
          - forbidigo
        path: pkg/build/
    paths:
      - devenv
      - scripts
      - third_party$
      - builtin$
      - examples$
      - pkg/util/xorm
issues:
  max-same-issues: 0
